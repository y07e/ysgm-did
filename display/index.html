  // 날짜 오버라이드 (1차 - 최우선)
  let overridesDoc = {};
  db.collection('settings').doc('lunchOverrides').onSnapshot(snap => {
    overridesDoc = (snap.exists && snap.data().overrides) ? snap.data().overrides : {};
    applyMyLunch();
  });

  // ===== 헬퍼 =====
  function _parseLocalDate(s) {
    if (!s) return null;
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function _sortClassKeys(arr) {
    return [...arr].sort((a, b) => {
      const [ga, ca] = a.split('-').map(Number);
      const [gb, cb] = b.split('-').map(Number);
      return ga !== gb ? ga - gb : ca - cb;
    });
  }
  function _getFloorOrder(f) {
    if (Array.isArray(f.classOrder) && f.classOrder.length) {
      const filtered = f.classOrder.filter(c => (f.classes || []).includes(c));
      (f.classes || []).forEach(c => { if (!filtered.includes(c)) filtered.push(c); });
      return filtered;
    }
    return _sortClassKeys(f.classes || []);
  }
  function _getMondayOf(date) {
    const d = new Date(date); d.setHours(0,0,0,0);
    const dow = d.getDay();
    const offset = (dow === 0) ? -6 : (1 - dow);
    d.setDate(d.getDate() + offset);
    return d;
  }
  function _getRotatedStartClass(floor, schedule, targetDate) {
    const order = _getFloorOrder(floor);
    if (!order.length || !floor.startClass) return floor.startClass;
    if (!floor.weeklyRotation || !schedule.startDate) return floor.startClass;
    const anchor = _getMondayOf(_parseLocalDate(schedule.startDate));
    const tgt    = _getMondayOf(targetDate);
    const weeks  = Math.round((tgt - anchor) / (7 * 86400000));
    const anchorIdx = order.indexOf(floor.startClass);
    if (anchorIdx === -1) return floor.startClass;
    const len = order.length;
    return order[((anchorIdx + weeks) % len + len) % len];
  }
  function _calcFloorTimes(floor, opts) {
    opts = opts || {};
    const order = _getFloorOrder(floor);
    if (!order.length) return [];
    const startClass = opts.startClass || floor.startClass;
    const startIdx = order.indexOf(startClass);
    if (startIdx === -1) return [];
    const queue = [...order.slice(startIdx), ...order.slice(0, startIdx)];
    const startTimeStr = opts.startTime || floor.startTime || '12:30';
    if (!startTimeStr.match(/^\d{1,2}:\d{2}$/)) return [];
    const [sH, sM] = startTimeStr.split(':').map(Number);
    const startMin = sH * 60 + sM;
    const interval = parseInt(floor.interval, 10) || 2;
    const duration = parseInt(floor.duration, 10) || 30;
    const fmt = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
    return queue.map((classKey, i) => ({
      classKey,
      start: fmt(startMin + i * interval),
      end:   fmt(startMin + i * interval + duration)
    }));
  }
  function _formatDateYMD(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function applyMyLunch() {
    const myKey = `${grade}-${cls}`;
    const today = new Date(); today.setHours(0,0,0,0);
    const todayStr = _formatDateYMD(today);
    const override = overridesDoc[todayStr];

    // 활성 운영 기간 찾기
    const activeSch = schedulesDoc.find(s => {
      if (!s.startDate || !s.endDate) return false;
      const start = _parseLocalDate(s.startDate); start.setHours(0,0,0,0);
      const end   = _parseLocalDate(s.endDate);   end.setHours(23,59,59,999);
      return today >= start && today <= end;
    });

    if (activeSch) {
      for (const floor of (activeSch.floors || [])) {
        if ((floor.classes || []).includes(myKey)) {
          // 1순위: 날짜 오버라이드 적용 (시작 시간만 override)
          const opts = {
            startClass: _getRotatedStartClass(floor, activeSch, today),
            startTime: override ? override.startTime : floor.startTime
          };
          const times = _calcFloorTimes(floor, opts);
          const me = times.find(t => t.classKey === myKey);
          if (me) { myLunch = { start: me.start, end: me.end }; return; }
        }
      }
    }
    // 2순위: lunchTimes 수동
    if (lunchTimesDoc[myKey]) { myLunch = lunchTimesDoc[myKey]; return; }
    if (lunchTimesDoc['default']) { myLunch = lunchTimesDoc['default']; return; }
    // 3순위: config 기본값
    myLunch = SCHOOL_CONFIG.defaultLunch;
  }

  // 매일 자정에 다시 적용 (날짜 바뀌면 자동 전환)
  setInterval(() => {
    const now = new Date();
    if (now.getHours() === 0 && now.getMinutes() === 0) applyMyLunch();
  }, 60 * 1000);

  // 시간표
  db.collection('timetable').doc(`${grade}-${cls}`).onSnapshot(snap => {
    timetable = snap.exists ? (snap.data() || {}) : {};
    const idx = getWeekdayIdx();
    renderDayTabs(idx);
    renderPeriods(idx);
  });

  // 일일 시간표 변경 (오늘 날짜만 적용)
  let dailyOverridesAll = {};
  db.collection('timetableOverrides').onSnapshot(snap => {
    dailyOverridesAll = {};
    snap.docs.forEach(d => dailyOverridesAll[d.id] = d.data());
    renderPeriods(getWeekdayIdx());
  });

  // 학교 공지 (인덱스 불필요 — 클라이언트 필터링)
  db.collection('announcements')
    .orderBy('createdAt','desc')
    .onSnapshot(snap => {
      const all = snap.docs.map(d => ({id:d.id,...d.data()}));
      schoolAnns  = filterSchoolAnns(all);
      schoolAnnIdx = 0;
      startSchoolSlideshow();
    });

  // 학급 게시판 (인덱스 불필요 — 클라이언트 필터링)
  db.collection('classAnnouncements')
    .orderBy('createdAt','desc')
    .onSnapshot(snap => {
      const now = new Date();
      const anns = snap.docs
        .map(d=>({id:d.id,...d.data()}))
        .filter(a => a.targetGrade === grade && a.targetClass === cls)
        .filter(a => a.isActive)
        .filter(a => !a.expiresAt?.toDate || a.expiresAt.toDate() > now);
      renderClassBoard(anns);
    });

  // D-Day 카운터 (상단 바)
  db.collection('dDays').orderBy('targetDate').onSnapshot(snap => {
    const today = new Date(); today.setHours(0,0,0,0);
    const items = snap.docs
      .map(d => ({id:d.id, ...d.data()}))
      .filter(d => d.isActive !== false)
      .map(d => {
        const target = d.targetDate?.toDate ? d.targetDate.toDate() : new Date();
        target.setHours(0,0,0,0);
        const diff = Math.round((target - today) / 86400000);
        return { ...d, diff, target };
      })
      .filter(d => d.diff >= -3) // 지난 D-Day는 3일 이내만 표시
      .map(d => {
        let txt, cls = '';
        if (d.diff === 0) { txt = 'D-DAY'; cls = 'dday-today'; }
        else if (d.diff > 0) {
          txt = `D-${d.diff}`;
          if (d.diff <= 7) cls = 'urgent';
        } else {
          txt = `D+${Math.abs(d.diff)}`;
        }
        return `<div class="dday-item ${cls}">
          <span class="dday-icon">${d.icon||'📅'}</span>
          <span class="dday-title">${d.title}</span>
          <span class="dday-count">${txt}</span>
        </div>`;
      });

    // 톱바 (D-Day 안내 + 양산 날씨) — 모든 환경 공통 (모바일/PC/IFP)
    const bar = document.getElementById('ddayBar');
    let html = '<div class="dday-items">';
    html += '<span class="dday-title">🎯 D-day 안내</span>';
    html += items.length ? items.join('') : '<span style="color:#475569;font-size:0.82rem;">D-Day 없음</span>';
    html += '</div>';
    html += '<div class="top-weather" id="topWeather"><span style="color:#475569;">날씨 불러오는 중...</span></div>';
    bar.innerHTML = html;
    bar.classList.add('show');
    // 이미 받아진 날씨 데이터가 있으면 즉시 표시
    if (window._lastWeatherHtml) {
      const tw = document.getElementById('topWeather');
      if (tw) tw.innerHTML = window._lastWeatherHtml;
    }
  });

  // 금주 학사일정
  db.collection('schoolEvents').orderBy('date').onSnapshot(snap => {
    const today = new Date(); today.setHours(0,0,0,0);
    const day = today.getDay();
    const offsetToMon = (day === 0) ? -6 : (1 - day);
    const monday = new Date(today); monday.setDate(today.getDate() + offsetToMon);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    sunday.setHours(23,59,59,999);

    const dayKor = ['일','월','화','수','목','금','토'];
    const events = snap.docs
      .map(d => ({id:d.id, ...d.data()}))
      .filter(e => e.isActive !== false)
      .map(e => ({...e, dateObj: e.date?.toDate ? e.date.toDate() : new Date()}))
      .filter(e => e.dateObj >= monday && e.dateObj <= sunday)
      .sort((a,b) => a.dateObj - b.dateObj);

    const el = document.getElementById('eventsContent');
    if (!events.length) {
      el.innerHTML = '<div class="events-empty">이번 주 일정이 없습니다</div>';
      return;
    }

    el.innerHTML = events.map(e => {
      const d = e.dateObj;
      const ed = new Date(d); ed.setHours(0,0,0,0);
      const isToday = ed.getTime() === today.getTime();
      const isPast  = ed < today;
      const cls = isToday ? 'today' : (isPast ? 'past' : '');
      return `<div class="event-item ${cls}">
        <div class="event-date">${d.getMonth()+1}/${d.getDate()}(${dayKor[d.getDay()]})</div>
        <div class="event-info">
          <div class="event-title">${e.icon||'📅'} ${e.title}</div>
          ${e.description ? `<div class="event-desc">${e.description}</div>` : ''}
        </div>
      </div>`;
    }).join('');
  });

  // 긴급 공지
  db.collection('emergency').doc('current').onSnapshot(snap => {
    const overlay = document.getElementById('emergencyOverlay');
    if (snap.exists) {
      const d = snap.data();
      const tg = d.targetGrades  || ['all'];
      const tc = d.targetClasses || ['all'];
      if (d.isActive &&
          (tg.includes('all')||tg.includes(grade)) &&
          (tc.includes('all')||tc.includes(cls))) {
        document.getElementById('emergencyTitle').textContent   = d.title   || '긴급 공지';
        document.getElementById('emergencyMessage').textContent = d.message || '';
        overlay.classList.add('active'); return;
      }
    }
    overlay.classList.remove('active');
  });

  // ============================================================
  // 양산 날씨 + 미세먼지 (Open-Meteo, 무료·키 불필요)
  // ============================================================
  const YANGSAN_LAT = 35.3350;
  const YANGSAN_LON = 129.0345;

  function weatherEmoji(code) {
    if (code === 0) return '☀️';
    if (code <= 2) return '🌤️';
    if (code === 3) return '☁️';
    if (code <= 48) return '🌫️';
    if (code <= 57) return '🌦️';
    if (code <= 67) return '🌧️';
    if (code <= 77) return '❄️';
    if (code <= 82) return '🌧️';
    if (code <= 86) return '🌨️';
    if (code <= 99) return '⛈️';
    return '🌤️';
  }
  function weatherDesc(code) {
    if (code === 0) return '맑음';
    if (code <= 2) return '대체로 맑음';
    if (code === 3) return '흐림';
    if (code <= 48) return '안개';
    if (code <= 57) return '이슬비';
    if (code <= 67) return '비';
    if (code <= 77) return '눈';
    if (code <= 82) return '소나기';
    if (code <= 86) return '눈 소나기';
    if (code <= 99) return '천둥번개';
    return '';
  }
  // 미세먼지(PM10) 등급
  function pm10Level(v) {
    if (v <= 30)  return { txt:'좋음',     cls:'aq-good' };
    if (v <= 80)  return { txt:'보통',     cls:'aq-moderate' };
    if (v <= 150) return { txt:'나쁨',     cls:'aq-bad' };
    return                { txt:'매우나쁨', cls:'aq-very-bad' };
  }
  // 초미세먼지(PM2.5) 등급
  function pm25Level(v) {
    if (v <= 15)  return { txt:'좋음',     cls:'aq-good' };
    if (v <= 35)  return { txt:'보통',     cls:'aq-moderate' };
    if (v <= 75)  return { txt:'나쁨',     cls:'aq-bad' };
    return                { txt:'매우나쁨', cls:'aq-very-bad' };
  }

  async function fetchWeather() {
    const el = document.getElementById('weatherContent');
    try {
      const wUrl = `https://api.open-meteo.com/v1/forecast?latitude=${YANGSAN_LAT}&longitude=${YANGSAN_LON}` +
        `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code&timezone=Asia%2FSeoul`;
      const aUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${YANGSAN_LAT}&longitude=${YANGSAN_LON}` +
        `&current=pm10,pm2_5&timezone=Asia%2FSeoul`;

      const [wRes, aRes] = await Promise.all([fetch(wUrl), fetch(aUrl)]);
      const wData = await wRes.json();
      const aData = await aRes.json();

      const w = wData.current;
      const a = aData.current;
      const code  = w.weather_code;
      const temp  = Math.round(w.temperature_2m);
      const feels = Math.round(w.apparent_temperature);
      const hum   = w.relative_humidity_2m;
      const pm10  = Math.round(a.pm10  || 0);
      const pm25  = Math.round(a.pm2_5 || 0);
      const p10   = pm10Level(pm10);
      const p25   = pm25Level(pm25);

      el.innerHTML = `
        <div class="weather-main">
          <div class="weather-icon">${weatherEmoji(code)}</div>
          <div class="weather-temp-block">
            <div class="weather-temp">${temp}°C</div>
            <div class="weather-desc">${weatherDesc(code)}</div>
          </div>
        </div>
        <div class="weather-rows">
          <div class="weather-row"><span class="weather-row-label">체감 온도</span><span class="weather-row-val">${feels}°C</span></div>
          <div class="weather-row"><span class="weather-row-label">습도</span><span class="weather-row-val">${hum}%</span></div>
          <div class="weather-row"><span class="weather-row-label">미세먼지</span><span class="weather-row-val ${p10.cls}">${p10.txt} · ${pm10}㎍</span></div>
          <div class="weather-row"><span class="weather-row-label">초미세먼지</span><span class="weather-row-val ${p25.cls}">${p25.txt} · ${pm25}㎍</span></div>
        </div>`;

      // 키오스크 모드: 톱바에 컴팩트 날씨 위젯도 함께 렌더
      const compactHtml = `
        <span class="tw-title">📍 양산 날씨</span>
        <div class="tw-sep"></div>
        <div class="tw-main">
          <span class="tw-icon">${weatherEmoji(code)}</span>
          <span class="tw-temp">${temp}°</span>
        </div>
        <div class="tw-sep"></div>
        <div class="tw-item"><span class="tw-label">체감</span><span class="tw-val">${feels}°</span></div>
        <div class="tw-item"><span class="tw-label">습도</span><span class="tw-val">${hum}%</span></div>
        <div class="tw-item"><span class="tw-label">미세</span><span class="tw-val ${p10.cls}">${p10.txt}</span></div>
        <div class="tw-item"><span class="tw-label">초미세</span><span class="tw-val ${p25.cls}">${p25.txt}</span></div>
      `;
      window._lastWeatherHtml = compactHtml;
      const tw = document.getElementById('topWeather');
      if (tw) tw.innerHTML = compactHtml;
    } catch (e) {
      el.innerHTML = '<div style="color:#475569;">날씨 정보를 불러올 수 없습니다</div>';
      const tw = document.getElementById('topWeather');
      if (tw) tw.innerHTML = '<span style="color:#475569;font-size:0.82rem;">날씨 불러올 수 없음</span>';
    }
  }

  // ============================================================
  // 초기 실행 (모든 함수·상수 정의가 완료된 후 호출)
  // ============================================================
  const initDay = getWeekdayIdx();
  renderDayTabs(initDay);
  fetchLunch();
  setInterval(fetchLunch, 60*60*1000);

  fetchWeather();
  setInterval(fetchWeather, 10*60*1000); // 10분마다 갱신

  // 시계 시작
  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
