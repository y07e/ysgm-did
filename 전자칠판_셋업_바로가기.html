<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="2; url=https://ysgm-did.web.app/start/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전자칠판 셋업 바로가기</title>
  <style>
    body {
      font-family: -apple-system, 'Noto Sans KR', sans-serif;
      background: #0f172a; color: #f1f5f9;
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .icon { font-size: 4rem; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
    p { color: #94a3b8; margin-bottom: 24px; }
    .spinner {
      width: 36px; height: 36px;
      border: 4px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a {
      color: #38bdf8; text-decoration: none;
      padding: 12px 24px; background: #1e293b;
      border-radius: 10px; font-weight: 700;
      display: inline-block; margin-top: 12px;
    }
    .url {
      font-family: monospace;
      background: #1e293b;
      padding: 8px 14px; border-radius: 8px;
      font-size: 0.9rem;
      color: #93c5fd;
      margin: 12px 0;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="icon">📺</div>
  <h1>양산여자중학교 전자칠판 셋업</h1>
  <p>잠시 후 셋업 페이지로 자동 이동합니다…</p>
  <div class="spinner"></div>
  <div class="url">https://ysgm-did.web.app/start/</div>
  <a href="https://ysgm-did.web.app/start/">지금 바로 이동 →</a>
  <p style="margin-top:30px;font-size:0.78rem;color:#475569;">
    이 파일을 USB에 담아 각 교실 전자칠판에서 열어주세요.<br>
    Chrome 브라우저로 열면 자동으로 셋업 페이지가 표시됩니다.
  </p>
</body>
</html>
